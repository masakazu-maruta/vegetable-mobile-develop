name: Manage Project

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, review, closed]
  workflow_dispatch:

jobs:
  issue-project:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue to project with status
        uses: ./.github/workflows/project-action/issue-assignment-to-project.yml
        with:
          ProjectNumber: 1
          RepositoryName: ${{ github.repository }}
          IssueNumber: ${{ github.event.issue.number }}
          HTML_URL: ${{ github.event.issue.html_url }}
          FieldKeyValues: '[{ "key": "Status", "value": "Todo" }]'
        secrets:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  
  issue-to-inprogress:
      if:  github.event_name == 'issues' && github.event.label.name == 'in-progress'
      runs-on: ubuntu-latest
      steps:
        - name: Move labeled issue to In Progress column
          uses: ./.github/workflows/project-action/issue-assignment-to-project.yml
          with:
            ProjectNumber: 1
            RepositoryName: ${{ github.repository }}
            IssueNumber: ${{ github.event.issue.number }}
            HTML_URL: ${{ github.event.issue.html_url }}
            FieldKeyValues: '[{ "key": "Status", "value": "InProgress" }]'
        secrets:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  pr-project:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Check for reviewers
        id: check_reviewers
        run: |
          REVIEWERS_COUNT=$(echo "${{ toJson(github.event.pull_request.requested_reviewers) }}" | jq 'length')
          if [ "$REVIEWERS_COUNT" -gt 0 ]; then
            echo "label=PR:InReview" >> $GITHUB_OUTPUT
          else
            echo "label=PR:Approved" >> $GITHUB_OUTPUT

      - name: Move PR to project column
        uses: ./.github/workflows/project-action/pr-assignment-to-project.yml
        with:
          ProjectNumber: 1
          RepositoryName: ${{ github.repository }}
          PRNumber: ${{ github.event.pull_request.number }}
          HTML_URL: ${{ github.event.pull_request.html_url }}
          FieldKeyValues: '[{ "key": "Status", "value": "${{ steps.check_reviewers.outputs.column }}" }]'
        secrets:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  auto-label-if-reject:
    if: github.event_name == 'pull_request' && github.event.action == 'review' && github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Check Review Status
        id: review_label
        run: |
          echo "label=PR:Rejected" >> "$GITHUB_OUTPUT"
          echo "remove_label=PR:Approved" >> "$GITHUB_OUTPUT"
          echo "column=PR:Rejected" >> "$GITHUB_OUTPUT"

      - name: Remove old status label
        if: steps.review_label.outputs.remove_label != ''
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.review_label.outputs.remove_label }}

      - name: Add new status label
        if: steps.review_label.outputs.label != ''
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.review_label.outputs.label }}

      - name: Move PR to Project Column
        if: steps.review_label.outputs.column != ''
        uses: ./.github/workflows/project-action/pr-assignment-to-project.yml
        with:
          ProjectNumber: 1
          RepositoryName: ${{ github.repository }}
          PRNumber: ${{ github.event.pull_request.number }}
          HTML_URL: ${{ github.event.pull_request.html_url }}
          FieldKeyValues: '[{ "key": "Status", "value": "${{ steps.review_label.outputs.column }}" }]'
        secrets:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  auto-merge-if-approved:
    if: github.event_name == 'pull_request' && github.event.action == 'review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Auto Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          TITLE="${{ github.event.pull_request.title }}"
          if ! gh pr merge $PR_URL --merge --delete-branch --admin; then
            echo "❌ 自動マージに失敗しました"
            MESSAGE="## ❌ **自動マージ失敗**\n📝 **タイトル:** $TITLE \n🔗 **リンク:** $PR_URL"
            curl -X POST -H "Content-Type: application/json" \
              -d "{\"content\": \"$MESSAGE\"}" \
              $DISCORD_WEBHOOK
            exit 1
          fi

  close-related-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from branch name
        id: extract_issue
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH_NAME" =~ ^([0-9]+)- ]]; then
            ISSUE_NUMBER="${BASH_REMATCH[1]}"
            echo "Found issue number: $ISSUE_NUMBER"
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "No issue number found in branch name"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi


      - name: Close related issue from branch name
        if: steps.extract_issue.outputs.issue_number != ''
        uses: peter-evans/close-issue@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment: |
            ✅ PR がマージされたため、この Issue は自動的にクローズされました
          issue-number: ${{ steps.extract_issue.outputs.issue_number }}

      - name: Check if Issue is Closed
        id: check_closed
        if: steps.extract_issue.outputs.issue_number != ''
        run: |
          ISSUE_NUMBER=${{ steps.extract_issue.outputs.issue_number }}
          STATUS=$(gh issue view $ISSUE_NUMBER --repo ${{ github.repository }} --json state --jq '.state')
          echo "Issue status: $STATUS"
          if [ "$STATUS" == "CLOSED" ]; then
            echo "is_closed=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_closed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}


      - name: Change Status Issue If Done
        if: steps.check_closed.outputs.is_closed == 'true'
        uses: ./.github/workflows/project-action/issue-assignment-to-project.yml
        with:
          ProjectNumber: 1
          RepositoryName: ${{ github.repository }}
          IssueNumber: ${{ steps.extract_issue.outputs.issue_number }}
          HTML_URL: https://github.com/${{ github.repository }}/issues/${{ steps.extract_issue.outputs.issue_number }}
          FieldKeyValues: '[{ "key": "Status", "value": "Done" }]'
        secrets:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}


